ball_soft:
  shape: sphere                    # sphere | box | cylinder | capsule
  size: [0.035]                    # MuJoCo half sizes in m
  mass: 0.05
  rgba: [0.85, 0.3, 0.3, 1]
  friction: 1.0
  contact_time: 0.015               # contact time constant in s, larger = softer, >= 2 * timestep
  damping_ratio: 1.0
  deformable: true                 # true | false, visual squash in Unreal

ball_hard:
  shape: sphere
  size: [0.035]
  mass: 0.08
  rgba: [0.3, 0.6, 0.3, 1]
  friction: 1.0
  contact_time: 0.003
  damping_ratio: 1.0
  deformable: false

