simulation:
  timestep: 0.001
  realtime: true
  duration: 0                      # seconds, 0 = run until closed

viewer:
  enabled: true                    # true | false (on macOS start with mjpython)
  fps: 60

hand:
  type: dexterous                  # dexterous | parallel_jaw
  jaw_input: thumb_index_mean      # thumb_index_mean | index | thumb (parallel_jaw only)
  start_pose:
    position: [0.25, 0.0, 0.92]
    orientation: [1, 0, 0, 0]
  weld_solref: [0.002, 1.0]        # time constant >= 2 * timestep, smaller = stiffer wrist
  weld_solimp: [0.99, 0.999, 0.001, 0.5, 2]

input:
  pose_source: viewer              # viewer | fixed | vive
  finger_source: viewer            # viewer | script | trigger | glove
  script:
    period: 4.0
    max_closure: 1.0
  trigger:
    max_closure: 1.0               # closure at full trigger pull

tracking:
  device: right                    # right | left | tracker | serial number, e.g. LHR-05870E8A
  rate: 500                        # SteamVR polling rate in Hz
  yaw_from: hmd                    # hmd | device, forward at calibrate: headset view or wand pointing direction
  calibration: calibration.yaml    # written by calibrate (alignment + grip), redo after moving the base station or changing the device
  wrist_offset: [0.0, -0.03, 0.1]  # hand root position in the device frame, m
  buttons:                         # menu | grip | trackpad | none
    reset_same: menu
    reset_new: grip
    calibrate: trackpad

session:
  engage_distance: 0.03            # m between tracked and sim hand to engage
  engage_angle: 20                 # deg between tracked and sim hand to engage
  lost_timeout: 0.2                # s of tracking loss before the hand is released

glove:
  transport: serial                # serial | udp (udp talks to tools/fake_glove.py)
  port: COM4                       # serial port, e.g. COM4 or /dev/cu.usbmodem101
  baud: 921600                     # UART bridge port, ignored on native USB
  udp_port: 9880                   # sim listens here for the fake glove
  torque_scale: 0.1                # servo Nm per unit of sim feedback (sim fingers 2 Nm max, XL330 ~0.2 Nm)
  torque_limit: 0.2                # Nm, upper bound sent to the glove
  filter_hz: 15                    # Hz, low-pass on sim feedback before sending, 0 = off
  damping: 0.0                     # Nm s per unit closure, glove-side damping on closing speed while in contact
  slew_rate: 10                    # Nm/s, glove-side torque rate limit, 0 = off
  timeout: 0.05                    # s without glove state before the viewer sliders take over

unreal:
  enabled: true                    # true | false
  host: 127.0.0.1
  state_port: 9870
  scene_port: 9871
  rate: 250                        # state packets per second
  scene_interval: 1.0              # seconds between scene description repeats
  command_host: 127.0.0.1          # interface the command listener binds to, 0.0.0.0 for remote renderers
  command_port: 9872               # JSON commands from the renderer

scene: scenes/default.yaml
objects: objects.yaml

recording:
  enabled: true
  directory: ../logs
