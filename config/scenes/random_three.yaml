environment: lab                  # none | lab | kitchen | studio, key in Project Settings > Haptic Glove > Environments

table:
  position: [0.5, 0.0]
  size: [0.8, 0.6, 0.04]
  height: 0.75
  rgba: [0.55, 0.45, 0.35, 1]

slots:
  - [-0.1, -0.15]
  - [-0.1, 0.0]
  - [-0.1, 0.15]

sample:
  from: [ball_soft, ball_hard, block_medium, block_hard]
  count: 3
  replace: true                    # true | false, allow the same type twice
  seed: null                       # integer for a repeatable draw, null = new draw each start
